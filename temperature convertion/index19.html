<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index19.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Advent+Pro:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>temperature convertion</title>
</head>
<body>
    <form>
        <div class="container1">
            <h3>Temperature Converter</h3>
            <input type="number" name="temp" id="input" value="0" class="tempInput"><br>
            <input type="radio" name="temperature" id="Tofahrenheit">
            <label for="Tofahrenheit" class="tempclass">Celsius to Fahrenheit</label><br>
            <input type="radio" name="temperature" id="Tocelsius">
            <label for="Tocelsius" class="tempclass">Fahrenheit to Celsius</label><br>
            <button type="button" id="submit" class="submitbutton">Submit</button>
        </div>

    <div class="container2">
        <p class="p1">Result:</p> <br>
        <div>
            <div class="border">
                <p id="p2" class="p2"></p>
            </div>
            
        </div>
    </div>
    </form>
    
<script src="index19.js"></script>
</body>
</html>
